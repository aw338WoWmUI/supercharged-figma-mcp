name = "supercharged-figma-relay"
main = "worker-relay.ts"
compatibility_date = "2025-01-01"

[vars]
WORKER_VERSION = "1.0.10"
# Keep hosted MCP closed unless MCP_API_KEYS is configured or this is explicitly set.
ALLOW_OPEN_MCP = "false"

[observability]
enabled = true
head_sampling_rate = 1.0

[durable_objects]
bindings = [
  { name = "RELAY_ROOM", class_name = "RelayRoomDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoomDO"]
